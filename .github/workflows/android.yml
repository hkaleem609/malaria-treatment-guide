name: Build Android APK

# The APK is the offline copy handed to community health workers, so it is
# built from the same index.html that goes to the website — never hand-copied.
# Run it manually, or tag a release (v1.0.0) to get an APK attached to that
# release for download and forwarding.

on:
  workflow_dispatch:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Pinned rather than relying on whatever Gradle the runner image ships:
      # AGP 8.5.2 needs Gradle 8.7+, and a runner image bump should not be able
      # to break the build that produces a clinical tool.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Read APP_VERSION from index.html
        id: ver
        run: |
          # Single source of truth: the version in the page IS the app version,
          # so the launcher and the footer stamp can never disagree.
          V=$(grep -oP 'const APP_VERSION\s*=\s*"\K[^"]+' index.html)
          if [ -z "$V" ]; then echo "APP_VERSION not found in index.html"; exit 1; fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "Building version $V (code ${{ github.run_number }})"

      - name: Copy the site into the APK assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html manifest.json icon-192.png icon-512.png android/app/src/main/assets/
          ls -l android/app/src/main/assets/

      - name: Decode signing keystore
        id: keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "Signing with the programme release key."
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set — falling back to the debug key. Fine for testing on a handset; do NOT distribute this build to the field."
          fi

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_VERSION_NAME: ${{ steps.ver.outputs.name }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Name the APK after its version
        id: apk
        run: |
          SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$SRC" ]; then echo "No APK produced"; exit 1; fi
          OUT="MalariaGuide-v${{ steps.ver.outputs.name }}-build${{ github.run_number }}.apk"
          cp "$SRC" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}
          retention-days: 90

      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.file }}
